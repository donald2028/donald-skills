name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install PyYAML

      - name: Validate JSON manifests
        run: python -c "import json,pathlib; files=['package.json','.claude-plugin/marketplace.json','.claude-plugin/plugin.json','.codex-plugin/plugin.json','.cursor-plugin/plugin.json','.kimi-plugin/plugin.json','gemini-extension.json','.agents/plugins/marketplace.json']; [json.loads(pathlib.Path(path).read_text(encoding='utf-8')) for path in files]"

      - name: Test agent infrastructure
        run: |
          python skills/donald-agent-infrastructure/scripts/test_audit_project_skills.py
          python skills/donald-agent-infrastructure/scripts/test_init_project_agent_infra.py

      - name: Validate generated manifests and vendored files
        run: |
          npm run build
          git diff --exit-code
          npm run build:check

      - name: Validate Skills CLI discovery
        run: npx --yes skills add . --list
